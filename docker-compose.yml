services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: priceflow
      POSTGRES_USER: priceflow
      POSTGRES_PASSWORD: priceflow
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priceflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Single-node Kafka in KRaft mode, no ZooKeeper.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two listeners: one for containers (kafka:9092), one for apps started from the host (localhost:29092).
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the topic up front instead of relying on auto-creation.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic price-changed --partitions 3 --replication-factor 1

  competitor:
    build:
      context: .
      args:
        PROJECT: PriceFlow.CompetitorService
    ports:
      - "5081:8080"

  api:
    build:
      context: .
      args:
        PROJECT: PriceFlow.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=priceflow;Username=priceflow;Password=priceflow
      ConnectionStrings__Redis: redis:6379
      CompetitorService__Url: http://competitor:8080
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      competitor:
        condition: service_started

  notifier:
    build:
      context: .
      args:
        PROJECT: PriceFlow.Notifier
    environment:
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "5082:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
