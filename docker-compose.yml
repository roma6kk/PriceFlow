services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: priceflow
      POSTGRES_USER: priceflow
      POSTGRES_PASSWORD: priceflow
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priceflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
