<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PriceFlow — live prices</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #1f2933; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    #status { font-size: 14px; color: #7b8794; margin-bottom: 24px; }
    #status.online { color: #1f9d55; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e4e7eb; }
    th { font-size: 12px; text-transform: uppercase; color: #7b8794; white-space: nowrap; }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .nowrap { white-space: nowrap; }
    td.name { min-width: 140px; }
    .up { color: #cc1f1a; }
    .down { color: #1f9d55; }
    tr.flash { animation: flash 1.2s ease-out; }
    @keyframes flash { from { background: #fff3c4; } to { background: transparent; } }
    #empty { color: #7b8794; padding: 24px 12px; }
    @media (max-width: 600px) {
      body { margin-top: 24px; }
      th, td { padding: 8px 6px; font-size: 14px; }
      th { font-size: 11px; }
      .optional { display: none; }
    }
  </style>
</head>
<body>
  <h1>Live prices</h1>
  <div id="status">connecting…</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>SKU</th>
          <th>Product</th>
          <th class="num optional">Competitor</th>
          <th class="num">Our price</th>
          <th class="num">Change</th>
          <th class="optional">Updated</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="empty">Waiting for the first price change…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script>
    const rows = document.getElementById('rows');
    const status = document.getElementById('status');
    const money = value => value == null ? '—' : value.toFixed(2) + ' ₽';

    const cell = (text, className) => {
      const td = document.createElement('td');
      td.textContent = text;
      if (className) td.className = className;
      return td;
    };

    const findPosition = sku =>
      [...rows.rows].find(r => r.id.localeCompare(sku) > 0) ?? null;

    const connection = new signalR.HubConnectionBuilder()
      .withUrl('/hubs/prices')
      .withAutomaticReconnect()
      .build();

    connection.on('PriceChanged', e => {
      document.getElementById('empty').hidden = true;

      let row = document.getElementById(e.sku);
      if (!row) {
        row = document.createElement('tr');
        row.id = e.sku;
        rows.insertBefore(row, findPosition(e.sku));
      }

      const diff = e.newPrice - e.oldPrice;
      const price = cell(money(e.newPrice), 'num');
      price.style.fontWeight = '600';

      row.replaceChildren(
        cell(e.sku, 'nowrap'),
        cell(e.name, 'name'),
        cell(money(e.competitorPrice), 'num optional'),
        price,
        cell((diff > 0 ? '+' : '') + diff.toFixed(2), 'num ' + (diff > 0 ? 'up' : 'down')),
        cell(new Date(e.changedAt).toLocaleTimeString(), 'nowrap optional'));

      row.classList.remove('flash');
      void row.offsetWidth;
      row.classList.add('flash');
    });

    const setStatus = (text, online) => {
      status.textContent = text;
      status.className = online ? 'online' : '';
    };

    const subscribe = () => connection.invoke('SubscribeAll').then(() => setStatus('online', true));

    connection.onreconnecting(() => setStatus('reconnecting…', false));
    connection.onreconnected(subscribe);
    connection.onclose(() => setStatus('offline', false));

    connection.start().then(subscribe).catch(() => setStatus('offline', false));
  </script>
</body>
</html>
