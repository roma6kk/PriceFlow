syntax = "proto3";

package competitor.v1;

option csharp_namespace = "PriceFlow.Contracts.Grpc";

import "google/protobuf/timestamp.proto";

service CompetitorPrices {
  // Price of a single product. Returns NOT_FOUND if the competitor does not sell it.
  rpc GetPrice (GetPriceRequest) returns (PriceReply);
}

message GetPriceRequest {
  string sku = 1;
}

message PriceReply {
  string sku = 1;
  // Money goes over the wire as integer kopecks: protobuf has no decimal type.
  int64 price_kopecks = 2;
  google.protobuf.Timestamp observed_at = 3;
}
